# Phase-0 feasibility spike — proves the M2 Pro can build a Metal acceleration
# structure and run a ray-query intersect via the `metal` (metal-rs) crate.
# Throwaway by design (see docs/AGENT_LEARNINGS once folded in). Its own
# [workspace] table keeps it OUT of the native/ workspace members, so the
# NVIDIA/Vulkan build (`cargo build --manifest-path native/Cargo.toml`) is
# untouched and this never compiles on non-macOS.
[package]
name = "metal-rt-spike"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "metal-rt-spike"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33.0"   # default feature `link` links the Metal framework; no build.rs
