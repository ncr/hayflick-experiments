[package]
name = "rt-viewer"
version = "0.1.0"
edition = "2021"
description = "Interactive window + capture harness for the rt-probe deterministic renderer (winit shell; binary name stays `viewer`)."

[[bin]]
name = "viewer"
path = "src/main.rs"

[dependencies]
rt-probe = { path = "../rt-probe" }
house-game = { path = "../house-game" }
# the personal game IDE (owner 2026-07-27) — headless UI model + rasterizer;
# this crate's ide_host.rs is the only adapter that knows both sides
ide = { path = "../ide" }
sim-core = { path = "../sim-core" }
iso-core = { path = "../iso-core" }
# destructibility exploration (voxel-physics-spike branch): PHYS=1 drops a
# Rapier brick wall + projectile into the gym as extra dynamic runs.
phys-spike = { path = "../phys-spike" }
ash = "0.38"
glam = "0.30"
png = "0.17"
winit = "0.30"
ash-window = "0.13"
raw-window-handle = "0.6"
font8x8 = { version = "0.3", default-features = false }
# synth-blip audio backend (audio.rs) — no assets, waveforms generated in code
cpal = "0.15"

# objc 0.2's `msg_send!` expands to a `feature = "cargo-clippy"` cfg check that
# rustc flags as unexpected. Declare it expected so genuine cfg typos still warn
# while this third-party artifact stays quiet (the per-fn allow can't catch it —
# the lint fires from the macro's own hygiene span).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

# Apple-Silicon (Metal) backend. metal-rs 0.33 (frozen/maintenance) — every RT
# symbol present + linked, verified on the M2 Pro (Phase-0 spike). Default
# feature `link` links the Metal framework; no build.rs. macOS-only target dep
# so the Linux/NVIDIA build never sees it. `ash` stays a common dep (used by
# rt-probe's shared types); vulkan_backend.rs itself is cfg'd out on macOS,
# so the Vulkan render path is compile-checked on the spawner box, not here.
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33.0"
objc = "0.2"
# Same version metal-rs 0.33 pins (NOT 0.1.x from the winit chain) so its
# `CGSize` unifies with metal's `set_drawable_size` arg — the version skew is
# why an earlier attempt at pinning the drawable size was abandoned.
core-graphics-types = "0.2.0"
