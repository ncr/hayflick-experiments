[package]
name = "house-game"
version = "0.1.0"
edition = "2021"
description = "The house game (ARCHITECTURE.md area C): level collision, commands, ECS systems, snapshot/state-hash — runs and tests fully headless (no GPU, no window)."

[dependencies]
sim-core = { path = "../sim-core" }
iso-core = { path = "../iso-core" }
glam = "0.30"
# Used by src/mapviz.rs (the library's top-down PNG map renderer) and thereby
# the map dev-tool bins (roommap, floormap). Pure CPU encoder, no GPU.
png = "0.17"

# Headless trace player: fixture level + trace.txt -> state digest. No GPU.
[[bin]]
name = "headless"
path = "src/bin/headless.rs"

# Scenario lab: trace.txt -> event TIMELINE + metrics (emergence experiments).
[[bin]]
name = "lab"
path = "src/bin/lab.rs"
