[package]
name = "rt-probe"
version = "0.1.0"
edition = "2021"
description = "The deterministic iso ray-traced renderer library — Vulkan ray_query reference path plus the shared frame surface consumed by rt-viewer's Metal twin."

[dependencies]
iso-core = { path = "../iso-core" }
ash = "0.38"
glam = "0.30"
gltf = { version = "1.4", features = ["import", "utils", "KHR_materials_emissive_strength"] }
